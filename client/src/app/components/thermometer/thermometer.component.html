@if (popularity) {
  <div class="progress">
    <div
      class="progress-bar"
      role="progressbar"
      [style.background-color]="
        popularity.percent >= 70
          ? 'green'
          : popularity.percent >= 40
            ? 'orange'
            : 'red'
      "
      [style.width.%]="popularity.percent"
      [attr.aria-valuenow]="popularity.percent"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <span class="progress-bar-text"
        >Popularity: {{ popularity.percent }}%</span
      >
    </div>
  </div>
}
